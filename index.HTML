<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Téléchargement de l'image</title>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    padding: 40px 20px;
    background: #f5f5f5;
  }
  img {
    max-width: 90%;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    margin-top: 20px;
  }
  a.button {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 24px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    font-weight: bold;
  }
  p.info {
    color: #555;
    font-size: 14px;
  }
</style>
</head>
<body>

  <h2>Bonjour</h2>
  <p class="info">apagnant</p>

  <!-- Aperçu de l'image -->
  <img src="mon-image.jpg" alt="Image">

  <!-- Lien de téléchargement (l'utilisateur clique lui-même) -->
  <a id="downloadLink" class="button" href="mon-image.jpg" download="mon-image.jpg">
    ⬇ Télécharger l'image
  </a>

  <p class="info">Sur iPhone : appui long sur l'image ci-dessus, puis "Enregistrer l'image".</p>

</body>
</html>
